<?xml version="1.0" encoding="UTF-8"?>
<svg width="120px" height="120px" viewBox="0 0 120 120" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>No Cameras</title>
    <g id="No-Cameras" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <circle id="Background" fill="#2A2A2A" cx="60" cy="60" r="60"></circle>
        <g id="Camera" transform="translate(20.000000, 30.000000)" stroke="#999999" stroke-width="3">
            <rect id="Body" x="0" y="10" width="60" height="40" rx="4"></rect>
            <path d="M60,30 L80,15 L80,45 L60,30 Z" id="Side"></path>
            <circle id="Lens" cx="30" cy="30" r="15"></circle>
            <circle id="Inner-Lens" cx="30" cy="30" r="8"></circle>
            <line x1="10" y1="10" x2="10" y2="0" id="Top-Left"></line>
            <line x1="50" y1="10" x2="50" y2="0" id="Top-Right"></line>
        </g>
        <line x1="15" y1="15" x2="105" y2="105" id="Slash" stroke="#FF4444" stroke-width="4"></line>
    </g>
</svg>
